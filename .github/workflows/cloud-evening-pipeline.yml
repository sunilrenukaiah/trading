# Evening pipeline: market sync → recommendations → email summary
# 18:05 IST = 12:35 UTC (after the 18:00 sync slot; also re-syncs if needed)

name: Cloud Evening Pipeline

on:
  schedule:
    - cron: "35 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force market sync even if already done today"
        type: boolean
        default: false
      force_recommendations:
        description: "Run recommendations even before 6:00 PM IST"
        type: boolean
        default: false

concurrency:
  group: cloud-evening-pipeline
  cancel-in-progress: false

jobs:
  evening:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_PROVIDER: nse
      PYTHONUNBUFFERED: "1"
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      EMAIL_ENABLED: ${{ secrets.EMAIL_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/pyproject.toml

      - name: Require DATABASE_URL secret
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::Add repository secret DATABASE_URL (Neon asyncpg URL)."
          exit 1

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r ../requirements.txt
          pip install -e .

      - name: Migrate schema
        run: python ../scripts/cloud_jobs.py migrate

      - name: Market sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_sync }}" = "true" ]; then
            python ../scripts/cloud_jobs.py market-sync --force
          else
            python ../scripts/cloud_jobs.py market-sync
          fi

      - name: Recommendations + email
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_recommendations }}" = "true" ]; then
            python ../scripts/cloud_jobs.py recommendations --force
          else
            python ../scripts/cloud_jobs.py recommendations
          fi
