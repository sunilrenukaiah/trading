# Daily recommendations after evening market sync
# 18:15 IST = 12:45 UTC, weekdays

name: Cloud Recommendations

on:
  schedule:
    - cron: "45 12 * * 1-5"
  workflow_dispatch:

concurrency:
  group: cloud-recommendations
  cancel-in-progress: false

jobs:
  recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_PROVIDER: nse
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/pyproject.toml

      - name: Require DATABASE_URL secret
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::Add repository secret DATABASE_URL (Neon asyncpg URL)."
          exit 1

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r ../requirements.txt
          pip install -e .

      - name: Migrate schema
        run: python ../scripts/cloud_jobs.py migrate

      - name: Daily recommendations
        run: python ../scripts/cloud_jobs.py recommendations
