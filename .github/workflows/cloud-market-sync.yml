# Cloud market sync (NSE) — free GitHub Actions cron
# Times are UTC ≈ 15:45 and 18:00 IST (UTC+5:30)

name: Cloud Market Sync

on:
  schedule:
    # 15:45 IST = 10:15 UTC
    - cron: "15 10 * * 1-5"
    # 18:00 IST = 12:30 UTC
    - cron: "30 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Force sync even if today's auto-sync already completed"
        type: boolean
        default: true

concurrency:
  group: cloud-market-sync
  cancel-in-progress: false

jobs:
  market-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATA_PROVIDER: nse
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/pyproject.toml

      - name: Require DATABASE_URL secret
        if: ${{ env.DATABASE_URL == '' }}
        run: |
          echo "::error::Add repository secret DATABASE_URL (Neon asyncpg URL)."
          exit 1

      - name: Install dependencies
        run: |
          pip install -U pip
          pip install -r ../requirements.txt
          pip install -e .

      - name: Migrate schema
        run: python ../scripts/cloud_jobs.py migrate

      - name: Market sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python ../scripts/cloud_jobs.py market-sync --force
          else
            python ../scripts/cloud_jobs.py market-sync
          fi
